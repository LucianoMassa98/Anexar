version: '3.8'

services:
  # Internal PostgreSQL Database (Local dev mirror of Railway DB)
  postgres:
    image: postgres:16-alpine
    container_name: anexar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anexar_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anexar_secret_key_2026}
      POSTGRES_DB: ${POSTGRES_DB:-anexar_internal_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - anexar_pgdata:/var/lib/postgresql/data
    networks:
      - anexar-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anexar_admin} -d ${POSTGRES_DB:-anexar_internal_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend REST API
  api-rest:
    build:
      context: ./api-rest
      dockerfile: Dockerfile
    container_name: anexar-api-rest
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://anexar_admin:anexar_secret_key_2026@postgres:5432/anexar_internal_db?schema=public}
      JWT_SECRET: ${JWT_SECRET:-anexar_jwt_development_secret_32_chars_min}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:4000/api/auth/google/callback}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - anexar-network

  # Frontend Web Application (React + Vite + Tailwind CSS)
  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: anexar-web-app
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    depends_on:
      - api-rest
    networks:
      - anexar-network

volumes:
  anexar_pgdata:
    driver: local

networks:
  anexar-network:
    driver: bridge

